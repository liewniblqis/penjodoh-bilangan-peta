<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peta Pengembaraan Townsville</title><style>*{box-sizing:border-box}body{margin:0;background:#a4ddff;font-family:Arial,sans-serif;color:#402444}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(14px,calc((100vw - 1440px)/2));background:#fff9;font-weight:700}.bar button{border:0;border-radius:20px;background:#f5a5d5;padding:9px 14px;font-weight:bold;cursor:pointer}.map{position:relative;width:min(100%,1440px);margin:auto;aspect-ratio:1440/793;background:url('peta-townsville.webp') center/100% 100% no-repeat}.spot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:30px;transform:translate(-50%,-50%);width:14%;height:8%;touch-action:manipulation}.spot:focus-visible{outline:4px solid #ffe400;background:#ffffff55}.spot.locked{cursor:not-allowed}.mark{position:absolute;right:-4%;top:-25%;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px #3338}.spot:not(.locked):hover{outline:3px solid #ffec54;background:#ffffff2c}.message{max-width:900px;margin:12px auto;padding:13px 16px;background:#fffdf2;border-radius:14px;text-align:center;font-weight:700}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){.mark{width:18px;height:18px;font-size:12px}.bar{font-size:13px}.message{margin:8px;font-size:13px}}</style></head><body><div class="bar"><span id="hello">🌸 Selamat datang, Wira Bahasa!</span><span id="progress">Kemajuan: 0/6 misi</span><button onclick="location.href='index.html'">Halaman Utama</button></div><main><div class="map" role="group" aria-label="Peta Pengembaraan Townsville"><button class="spot" style="left:23.5%;top:38%" data-n="1" aria-label="Akademi, Misi 1"><span class="sr">Akademi</span><span class="mark"></span></button><button class="spot" style="left:57.3%;top:43%" data-n="2" aria-label="Pasar Raya, Misi 2"><span class="sr">Pasar Raya</span><span class="mark"></span></button><button class="spot" style="left:80.5%;top:58.5%" data-n="3" aria-label="Taman, Misi 3"><span class="sr">Taman</span><span class="mark"></span></button><button class="spot" style="left:15.3%;top:75.5%" data-n="4" aria-label="Makmal, Misi 4"><span class="sr">Makmal</span><span class="mark"></span></button><button class="spot" style="left:47.7%;top:87%" data-n="5" aria-label="Detektif, Misi 5"><span class="sr">Detektif</span><span class="mark"></span></button><button class="spot" style="left:83.7%;top:92%" data-n="6" aria-label="Bandar, Misi 6"><span class="sr">Bandar</span><span class="mark"></span></button></div><p class="message" id="message" aria-live="polite">Tekan lokasi yang terbuka untuk memulakan misi!</p></main><script>const tahap=Math.min(7,Math.max(1,Number(localStorage.getItem('townsville_tahap')||1)));let nama=localStorage.getItem('misiPenyelamatKataNama')||'';document.getElementById('hello').textContent='🌸 Selamat datang'+(nama?', '+nama:'')+'!';const completed=[1,2,3,4,5,6].filter(n=>localStorage.getItem('townsville_selesai_'+n)==='1');document.getElementById('progress').textContent='Kemajuan: '+completed.length+'/6 misi';document.querySelectorAll('.spot').forEach(b=>{let n=Number(b.dataset.n),ok=n<=tahap;b.classList.toggle('locked',!ok);b.querySelector('.mark').textContent=completed.includes(n)?'✅':ok?'▶':'🔒';b.setAttribute('aria-disabled',String(!ok));b.onclick=()=>{if(!ok){document.getElementById('message').textContent='🔒 Selesaikan Misi '+(n-1)+' dahulu untuk membuka Misi '+n+'.';return}location.assign('misi'+n+'.html')}});if(tahap===7)document.getElementById('message').textContent='🏆 Tahniah! Keenam-enam misi telah berjaya diselesaikan.';</script></body></html>
